<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLOCK IT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Permanent+Marker&family=Rubik+Mono+One&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #111;
    --ink: #f5f5f0;
    --black: #000;
    --lime: #c6ff00;
    --pink: #ff2e88;
    --cyan: #00e5ff;
    --yellow: #ffd400;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    font-family: "Black Han Sans", system-ui, sans-serif;
    background-color: var(--bg);
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.09'/></svg>"),
      repeating-linear-gradient(0deg, transparent 0 38px, rgba(255,255,255,.025) 38px 40px),
      repeating-linear-gradient(90deg, transparent 0 78px, rgba(255,255,255,.02) 78px 80px);
    overflow-x: hidden;
  }

  /* 상단 경고 테이프 */
  .tape {
    background: repeating-linear-gradient(45deg, var(--yellow) 0 18px, var(--black) 18px 36px);
    padding: 6px 0;
    transform: rotate(-2deg);
    margin: 18px -20px 0;
    box-shadow: 0 6px 0 rgba(0,0,0,.5);
  }
  .tape-inner {
    background: var(--yellow);
    color: var(--black);
    white-space: nowrap;
    overflow: hidden;
    font-size: 15px;
    letter-spacing: 2px;
    padding: 4px 0;
  }
  .marquee { display: inline-block; animation: slide 14s linear infinite; }
  @keyframes slide { to { transform: translateX(-50%); } }

  .wrap { max-width: 440px; margin: 0 auto; padding: 14px 16px 48px; text-align: center; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .sfx {
    font-family: "Black Han Sans", sans-serif;
    font-size: 13px;
    min-height: 0;
    flex: none;
    padding: 6px 10px;
    border-radius: 8px;
    box-shadow: 3px 3px 0 var(--cyan);
    transform: rotate(4deg);
  }
  .sfx[aria-pressed="false"] { background: #333; color: #aaa; box-shadow: 3px 3px 0 #000; }

  /* 그래피티 태그 타이틀 */
  h1 {
    position: relative;
    display: inline-block;
    font-family: "Permanent Marker", cursive;
    font-weight: 400;
    font-size: clamp(40px, 12vw, 52px);
    line-height: 1;
    margin: 10px 0 14px;
    color: var(--pink);
    transform: rotate(-5deg);
    text-shadow: 0 0 18px rgba(255,46,136,.55), 4px 4px 0 var(--black);
  }
  h1 i {
    position: absolute;
    width: 5px;
    border-radius: 0 0 4px 4px;
    background: var(--pink);
    top: 82%;
  }
  h1 i::after {
    content: "";
    position: absolute;
    left: -1.5px; bottom: -6px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--pink);
  }
  /* 스니커즈 밑창 */
  .deck {
    position: relative;
    width: min(210px, 58vw);
    aspect-ratio: 1;
    margin: 0 auto;
  }
  .ring { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 6; }
  .ring .track { stroke: rgba(255,255,255,.08); }
  .ring .prog { stroke: var(--cyan); stroke-linecap: round; filter: drop-shadow(0 0 6px var(--cyan)); }
  .sole {
    position: absolute;
    inset: 14px;
    filter: drop-shadow(0 12px 16px rgba(0,0,0,.75)) drop-shadow(0 0 20px rgba(255,46,136,.3));
  }
  .sole svg {
    width: 100%;
    height: 100%;
    display: block;
    animation: spin 2s linear infinite;
    animation-play-state: paused;
  }
  .running .sole svg { animation-play-state: running; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 랩 카운트 스티커 */
  .badge {
    position: absolute;
    left: -10px; bottom: 26px;
    background: var(--lime);
    color: var(--black);
    font-family: "Permanent Marker", cursive;
    font-size: 15px;
    padding: 3px 10px;
    border: 3px solid var(--black);
    border-radius: 6px;
    transform: rotate(-10deg);
    box-shadow: 3px 3px 0 var(--black);
  }

  /* 상태 스티커 */
  .status {
    position: absolute;
    top: 4px; right: -6px;
    background: var(--ink);
    color: var(--black);
    font-size: 14px;
    padding: 4px 10px;
    border: 3px solid var(--black);
    transform: rotate(10deg);
    box-shadow: 3px 3px 0 var(--black);
  }
  .status.rec { background: var(--pink); color: #fff; }
  .status.rec::before { content: "● "; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* 시간 */
  .time {
    position: relative;
    display: inline-block;
    font-family: "Rubik Mono One", monospace;
    font-size: clamp(38px, 12vw, 58px);
    margin: -12px 0 24px;
    padding: 6px 14px 10px;
    background: rgba(17,17,17,.92);
    border: 3px solid var(--ink);
    border-radius: 12px;
    box-shadow: 5px 5px 0 var(--black);
    transform: rotate(-1deg);
    color: var(--ink);
    text-shadow: -3px 0 var(--pink), 3px 0 var(--cyan), 0 6px 0 var(--black);
    letter-spacing: -1px;
  }
  .time .ms { font-size: .6em; }

  /* 스티커 버튼 */
  .buttons { display: flex; gap: 14px; }
  button {
    flex: 1;
    min-height: 68px;
    font-family: "Black Han Sans", sans-serif;
    font-size: 22px;
    line-height: 1.1;
    color: var(--black);
    background: var(--ink);
    border: 3px solid var(--black);
    border-radius: 14px;
    box-shadow: 0 0 0 3px var(--ink), 6px 6px 0 3px var(--pink);
    cursor: pointer;
    transition: transform .08s, box-shadow .08s;
  }
  button small { display: block; font-size: 12px; letter-spacing: 1px; opacity: .7; }
  #lapBtn { transform: rotate(-3deg); }
  #startBtn { background: var(--lime); transform: rotate(1deg); box-shadow: 0 0 0 3px var(--ink), 6px 6px 0 3px var(--cyan); }
  #resetBtn { transform: rotate(3deg); }
  #startBtn.on { background: var(--pink); color: #fff; box-shadow: 0 0 0 3px var(--ink), 6px 6px 0 3px var(--yellow); }
  button:active:not(:disabled) { transform: translate(5px, 5px) rotate(0); box-shadow: 0 0 0 3px var(--ink), 1px 1px 0 3px var(--pink); }
  button:disabled, #startBtn:disabled {
    background: transparent;
    color: #666;
    border: 3px dashed #444;
    box-shadow: none;
    cursor: not-allowed;
  }
  button:focus-visible { outline: 3px dashed var(--yellow); outline-offset: 8px; }

  /* 트랙리스트 */
  .tracks { margin-top: 26px; text-align: left; }
  .tracks h2 {
    display: inline-block;
    margin: 0 0 12px;
    font-size: 18px;
    font-weight: 400;
    background: var(--yellow);
    color: var(--black);
    padding: 4px 12px;
    transform: rotate(-2deg);
  }
  .laps { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow-y: auto; }
  .laps li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 4px;
    border-bottom: 2px dashed #2a2a2a;
    font-family: "Rubik Mono One", monospace;
    font-size: 16px;
    animation: pop .25s ease-out;
  }
  .laps li .no { color: #999; font-size: 13px; }
  .laps li .t { margin-left: auto; }
  .tag { font-family: "Black Han Sans", sans-serif; font-size: 12px; padding: 2px 8px; border-radius: 4px; color: var(--black); }
  .best .tag { background: var(--lime); }
  .worst .tag { background: var(--pink); color: #fff; }
  .best .t { color: var(--lime); }
  .worst .t { color: var(--pink); }
  .empty { color: #666; font-size: 14px; padding: 8px 4px; }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } }

  .keys { margin-top: 28px; font-size: 13px; color: #888; }
  kbd {
    display: inline-block;
    font-family: "Rubik Mono One", monospace;
    font-size: 11px;
    padding: 3px 7px;
    margin: 0 3px 0 10px;
    border: 2px solid #555;
    border-bottom-width: 4px;
    border-radius: 6px;
    color: var(--ink);
  }

  @media (prefers-reduced-motion: reduce) {
    .marquee, .vinyl, .status.rec::before, .laps li { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="tape"><div class="tape-inner"><span class="marquee">CLOCK IT ★ 스탑워치 ★ NO CAP ★ KEEP THE BEAT ★ 1초도 놓치지 마 ★ CLOCK IT ★ 스탑워치 ★ NO CAP ★ KEEP THE BEAT ★ 1초도 놓치지 마 ★&nbsp;</span></div></div>

  <div class="wrap" id="app">
    <div class="top">
      <h1>Clock It<i style="left:18%;height:14px"></i><i style="left:47%;height:24px"></i><i style="left:80%;height:10px"></i></h1>
      <button class="sfx" id="sfxBtn" aria-pressed="true">SFX ON</button>
    </div>

    <div class="deck">
      <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="track" cx="50" cy="50" r="46"/>
        <circle class="prog" id="prog" cx="50" cy="50" r="46" pathLength="100" stroke-dasharray="0 100"/>
      </svg>
      <div class="sole">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <path id="soleShape" d="M50 5 C67 5 75 19 75 33 C75 46 70 54 66 60 C63 66 64 74 64 80 C64 89 58 95 50 95 C42 95 36 89 36 80 C36 72 37 66 34 60 C30 54 25 46 25 33 C25 19 33 5 50 5 Z"/>
            <clipPath id="outsoleClip">
              <use href="#soleShape" transform="translate(50 50) scale(.86) translate(-50 -50)"/>
            </clipPath>
            <!-- 헤링본 트레드 -->
            <pattern id="tread" width="6" height="4" patternUnits="userSpaceOnUse">
              <path d="M0 4 L3 1 L6 4" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="1.1"/>
            </pattern>
            <pattern id="airStripes" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
              <rect width="1.4" height="3" fill="rgba(255,255,255,.55)"/>
            </pattern>
          </defs>
          <!-- 미드솔 -->
          <use href="#soleShape" fill="#f5f5f0" stroke="#000" stroke-width="2.4"/>
          <!-- 아웃솔 + 트레드 -->
          <g clip-path="url(#outsoleClip)">
            <rect width="100" height="100" fill="#ff2e88"/>
            <rect width="100" height="100" fill="url(#tread)"/>
            <rect y="52" width="100" height="12" fill="#c6ff00"/>
            <rect y="52" width="100" height="12" fill="url(#tread)"/>
          </g>
          <use href="#soleShape" transform="translate(50 50) scale(.86) translate(-50 -50)" fill="none" stroke="#000" stroke-width="1.6"/>
          <!-- 앞꿈치 피벗 서클 -->
          <circle cx="50" cy="28" r="12" fill="#ff2e88" stroke="#000" stroke-width="1.8"/>
          <circle cx="50" cy="28" r="8" fill="none" stroke="#000" stroke-width="1.2"/>
          <circle cx="50" cy="28" r="4" fill="#000"/>
          <!-- 아치 로고 -->
          <text x="50" y="61" text-anchor="middle" font-family="Permanent Marker, cursive" font-size="5.6" fill="#000">CLOCK IT</text>
          <!-- 뒤꿈치 에어 윈도우 -->
          <ellipse cx="50" cy="81" rx="8" ry="7" fill="#00e5ff" stroke="#000" stroke-width="1.8"/>
          <ellipse cx="50" cy="81" rx="8" ry="7" fill="url(#airStripes)"/>
        </svg>
      </div>
      <div class="badge" id="sideLabel">LAP 00</div>
      <div class="status" id="status">READY</div>
    </div>

    <div class="time" id="display" aria-live="off">00:00.<span class="ms">00</span></div>

    <div class="buttons">
      <button id="lapBtn" disabled>LAP<small>기록</small></button>
      <button id="startBtn">DROP<small>시작</small></button>
      <button id="resetBtn" disabled>RESET<small>리셋</small></button>
    </div>

    <section class="tracks">
      <h2>TRACKLIST</h2>
      <ul class="laps" id="laps"><li class="empty">아직 트랙 없음. 달리면서 LAP 찍어봐</li></ul>
    </section>

    <div class="keys"><kbd>SPACE</kbd>시작/멈춤 <kbd>L</kbd>기록 <kbd>R</kbd>리셋</div>
  </div>

<script>
  const app = document.getElementById('app');
  const display = document.getElementById('display');
  const prog = document.getElementById('prog');
  const statusEl = document.getElementById('status');
  const startBtn = document.getElementById('startBtn');
  const lapBtn = document.getElementById('lapBtn');
  const resetBtn = document.getElementById('resetBtn');
  const lapList = document.getElementById('laps');
  const sfxBtn = document.getElementById('sfxBtn');
  const sideLabel = document.getElementById('sideLabel');
  const EMPTY = '<li class="empty">아직 트랙 없음. 달리면서 LAP 찍어봐</li>';

  // 효과음(Web Audio로 직접 합성)과 진동
  let sfxOn = true, audio = null;
  function hit(kind) {
    if (navigator.vibrate) navigator.vibrate(kind === 'lap' ? 15 : 30);
    if (!sfxOn) return;
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t = audio.currentTime;
    const osc = audio.createOscillator(), gain = audio.createGain();
    const freq = { start: [180, 60], stop: [90, 40], lap: [900, 600], reset: [400, 80] }[kind];
    osc.type = kind === 'lap' ? 'square' : 'sine';
    osc.frequency.setValueAtTime(freq[0], t);
    osc.frequency.exponentialRampToValueAtTime(freq[1], t + 0.15);
    gain.gain.setValueAtTime(kind === 'lap' ? 0.08 : 0.4, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    osc.connect(gain).connect(audio.destination);
    osc.start(t);
    osc.stop(t + 0.2);
  }
  sfxBtn.addEventListener('click', () => {
    sfxOn = !sfxOn;
    sfxBtn.setAttribute('aria-pressed', sfxOn);
    sfxBtn.textContent = sfxOn ? 'SFX ON' : 'SFX OFF';
    sfxBtn.blur();
  });

  let running = false;
  let startTime = 0;   // performance.now() 기준 시작 시각
  let elapsed = 0;     // 정지 시점까지 누적된 시간(ms)
  let laps = [];       // 각 랩의 구간 시간(ms)
  let lastLapTotal = 0;
  let rafId = null;

  const pad = n => String(n).padStart(2, '0');
  const now = () => running ? elapsed + (performance.now() - startTime) : elapsed;

  function format(ms, html) {
    const totalCs = Math.floor(ms / 10);
    const cs = totalCs % 100;
    const totalSec = Math.floor(totalCs / 100);
    const h = Math.floor(totalSec / 3600);
    const main = (h ? h + ':' : '') + pad(Math.floor(totalSec / 60) % 60) + ':' + pad(totalSec % 60);
    return html ? `${main}.<span class="ms">${pad(cs)}</span>` : `${main}.${pad(cs)}`;
  }

  function render() {
    const t = now();
    display.innerHTML = format(t, true);
    prog.setAttribute('stroke-dasharray', `${(t % 60000) / 600} 100`);
    if (running) rafId = requestAnimationFrame(render);
  }

  function setStatus(text, rec) {
    statusEl.textContent = text;
    statusEl.classList.toggle('rec', rec);
  }

  function renderLaps() {
    sideLabel.textContent = `LAP ${pad(laps.length)}`;
    if (!laps.length) { lapList.innerHTML = EMPTY; return; }
    lapList.innerHTML = '';
    const min = Math.min(...laps), max = Math.max(...laps);
    for (let i = laps.length - 1; i >= 0; i--) {
      const li = document.createElement('li');
      let tag = '';
      if (laps.length > 1 && laps[i] === min) { li.className = 'best'; tag = '<span class="tag">FIRE</span>'; }
      else if (laps.length > 1 && laps[i] === max) { li.className = 'worst'; tag = '<span class="tag">SLOW</span>'; }
      li.innerHTML = `<span class="no">TRACK ${pad(i + 1)}</span>${tag}<span class="t">${format(laps[i])}</span>`;
      lapList.appendChild(li);
    }
  }

  function toggle() {
    hit(running ? 'stop' : 'start');
    if (running) {
      elapsed = now();
      running = false;
      cancelAnimationFrame(rafId);
      startBtn.innerHTML = 'DROP<small>다시 시작</small>';
      setStatus('PAUSED', false);
    } else {
      startTime = performance.now();
      running = true;
      startBtn.innerHTML = 'PAUSE<small>멈춤</small>';
      setStatus('REC', true);
      render();
    }
    startBtn.classList.toggle('on', running);
    app.classList.toggle('running', running);
    lapBtn.disabled = !running;
    resetBtn.disabled = running || elapsed === 0;
  }

  function lap() {
    if (!running) return;
    hit('lap');
    const total = now();
    laps.push(total - lastLapTotal);
    lastLapTotal = total;
    renderLaps();
  }

  function reset() {
    if (running || elapsed === 0) return;
    hit('reset');
    elapsed = 0;
    laps = [];
    lastLapTotal = 0;
    renderLaps();
    startBtn.innerHTML = 'DROP<small>시작</small>';
    setStatus('READY', false);
    resetBtn.disabled = true;
    render();
  }

  // 클릭 후 포커스를 풀어 Space 키가 버튼을 한 번 더 누르지 않게 한다
  startBtn.addEventListener('click', () => { toggle(); startBtn.blur(); });
  lapBtn.addEventListener('click', () => { lap(); lapBtn.blur(); });
  resetBtn.addEventListener('click', () => { reset(); resetBtn.blur(); });

  document.addEventListener('keydown', e => {
    if (e.repeat) return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'KeyL') lap();
    else if (e.code === 'KeyR') reset();
  });
</script>
</body>
</html>
